<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Statistika regressi</title>

<style>

:root{
  --card-max-width:1100px;
  --card-desktop-height:820px;
  --card-mobile-height:96vh;
}

html,body{
  height:100%;
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
}

/* background gif */

.bg-gif{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
  pointer-events:none;
  filter:brightness(.55) saturate(1.05);
}

/* page */

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
}

/* card */

.card{
  width:min(var(--card-max-width),96%);
  height:min(var(--card-desktop-height),92vh);
  background:rgba(0,0,0,.95);
  color:#fff;
  border-radius:16px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* header */

.card-header{
  padding:1rem 1.25rem;
  border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  flex-direction:column;
}

.title{
  font-size:1.2rem;
  font-weight:700;
}

.subtitle{
  font-size:.9rem;
  opacity:.85;
}

/* response counter */

.resp-badge{
  background:rgba(255,255,255,.08);
  padding:.4rem .8rem;
  border-radius:10px;
  font-weight:700;
  font-size:.95rem;
}

/* iframe */

.iframe-wrap{
  flex:1;
  padding:.8rem;
}

iframe{
  width:100%;
  height:100%;
  border:0;
  border-radius:10px;
}

/* footer */

.card-footer{
  padding:.7rem 1rem;
  font-size:.9rem;
  opacity:.85;
  border-top:1px solid rgba(255,255,255,.05);
}

/* button */

.controls{
  position:fixed;
  right:1rem;
  bottom:1rem;
}

.btn{
  background:rgba(255,255,255,.08);
  color:white;
  border:none;
  padding:.55rem .95rem;
  border-radius:10px;
  cursor:pointer;
}

/* mobile */

@media(max-width:900px){

.card{
  width:calc(100% - 1.5rem);
  height:var(--card-mobile-height);
}

.title{font-size:1.05rem}

}

@media(max-width:520px){

.page{padding:.6rem}

.card{
  width:calc(100% - 1rem);
  height:var(--card-mobile-height);
  border-radius:10px;
}

.card-header{
  padding:.75rem;
}

.iframe-wrap{
  padding:.45rem;
}

.subtitle{
  font-size:.85rem;
}

.resp-badge{
  font-size:.85rem;
}

}

</style>
</head>

<body>

<img id="bgGif" class="bg-gif" src="bg.gif">

<main class="page">

<section class="card">

<div class="card-header">

<div class="brand">
<div class="title">Statistika regresi ⭐</div>
<div class="subtitle">
Hubungan pengaruh jumlah uang saku dengan penghasilan dalam waktu 1 minggu
</div>
</div>

<div id="respBadge" class="resp-badge">
Responses: —
</div>

</div>

<div class="iframe-wrap">

<iframe
src="https://docs.google.com/forms/d/e/1FAIpQLScqaX-aPUuq9UxdKuuf_wFxFRCMdrpjEPHhsYZLtyvUKGk7iQ/viewform?embedded=true">
</iframe>

</div>

<div class="card-footer">
Note: Data akan tidak dipersebarluaskan
</div>

</section>

</main>

<div class="controls">
<button id="toggleBtn" class="btn">Hide GIF</button>
</div>

<script>

/* gif toggle */

const btn=document.getElementById("toggleBtn")
const bg=document.getElementById("bgGif")

let hidden=false

btn.onclick=()=>{
hidden=!hidden
bg.style.visibility=hidden?"hidden":"visible"
btn.textContent=hidden?"Show GIF":"Hide GIF"
}

/* response counter */

const API_URL="https://script.google.com/macros/s/AKfycbzL4L0koBhUjThDjQefHNyuCaH3OXUsBFUesu_lvpvHk2PgPvBE5L6WzePjD4NfLnEo/exec"

const badge=document.getElementById("respBadge")

const POLL_INTERVAL=30000

async function updateBadge(){

try{

const r=await fetch(API_URL,{cache:"no-store"})
const j=await r.json()

badge.textContent=`Responses: ${j.count} / ${j.target}`

}

catch(err){

badge.textContent="Responses: error"

}

}

updateBadge()

setInterval(updateBadge,POLL_INTERVAL)

</script>

</body>
</html>
