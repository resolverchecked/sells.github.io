<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Survey — Cool Site (Animated, Fixed)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#07102a; --bg2:#07102b; --card:#07112733;
    --accent1:#7b5cff; --accent2:#00c3ff; --glass: rgba(255,255,255,0.04);
    --muted: rgba(234,240,255,0.75);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:Inter,system-ui,Segoe UI,Roboto,Arial; color:#eaf0ff;
    background: linear-gradient(180deg,var(--bg1), #041026 60%);
    overflow:hidden; display:flex;align-items:center;justify-content:center;padding:28px;
  }

  /* BACKGROUND LAYERS */
  .bg { position:fixed; inset:0; z-index:-50; pointer-events:none; }
  .bg-gradient{ position:absolute; inset:0; background: radial-gradient(600px 400px at 10% 10%, rgba(123,92,255,0.14), transparent 8%), radial-gradient(500px 300px at 95% 85%, rgba(0,195,255,0.08), transparent 10%); mix-blend-mode: screen; opacity:0.95; filter: blur(14px); animation: gradientMove 18s linear infinite; }
  @keyframes gradientMove{ 0%{transform:translate(-2%, -1%) scale(1)} 50%{transform:translate(3%, 2%) scale(1.03)} 100%{transform:translate(-2%, -1%) scale(1)} }

  .blobs{position:absolute;inset:0;overflow:hidden}
  .blob{ position:absolute; width:420px; height:420px; border-radius:50%; background: radial-gradient(circle at 30% 30%, rgba(123,92,255,0.85), transparent 30%), radial-gradient(circle at 70% 70%, rgba(0,195,255,0.6), transparent 35%); filter: blur(36px) saturate(130%); opacity:.55; mix-blend-mode:screen; transform-origin:center; }
  .blob.b1{left:-12%; top:4%; animation: blobmove1 22s ease-in-out infinite}
  .blob.b2{right:-18%; bottom:-6%; width:380px; height:380px; animation: blobmove2 26s ease-in-out infinite}
  .blob.b3{left:25%; bottom:8%; width:320px; height:320px; animation: blobmove3 30s ease-in-out infinite}
  @keyframes blobmove1{ 0%{transform:translate(0,0) scale(1)} 25%{transform:translate(8vw, -4vh) scale(1.05)} 50%{transform:translate(0,6vh) scale(.95)} 75%{transform:translate(-6vw, -2vh) scale(1.03)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes blobmove2{ 0%{transform:translate(0,0) scale(1)} 30%{transform:translate(-6vw, 6vh) scale(1.08)} 60%{transform:translate(6vw,-6vh) scale(.92)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes blobmove3{ 0%{transform:translate(0,0) scale(1)} 40%{transform:translate(10vw, 8vh) scale(1.06)} 80%{transform:translate(-8vw,-4vh) scale(.96)} 100%{transform:translate(0,0) scale(1)} }

  .grain{position:absolute;inset:0; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><filter id="n"><feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.03"/></svg>'); mix-blend-mode:overlay; opacity:.7}

  #stars{position:absolute;inset:0;opacity:.9}

  .wrap{width:100%;max-width:1000px;z-index:2}
  header.site-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
  .brand{display:flex;gap:14px;align-items:center}
  .logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#012;font-size:20px;box-shadow:0 12px 36px rgba(123,92,255,0.14), inset 0 -8px 24px rgba(0,0,0,0.14)}
  h1{margin:0;font-size:20px;letter-spacing:-0.3px}
  p.lead{margin:0;color:var(--muted)}
  .actions{display:flex;gap:10px;align-items:center}
  .btn{background:linear-gradient(90deg,var(--accent1),var(--accent2));border:none;padding:10px 14px;border-radius:12px;color:#021;font-weight:700;cursor:pointer;box-shadow:0 12px 34px rgba(11,18,44,0.6);}
  .subtle{background:rgba(255,255,255,0.03);padding:8px 10px;border-radius:10px;font-size:13px}

  .card{position:relative;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:16px; padding:18px; box-shadow:0 18px 60px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.04); overflow:hidden}

  .iframe-wrap{position:relative;width:100%;height:720px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.03); backdrop-filter: blur(6px)}
  .iframe-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}

  .meta{display:flex;gap:12px;align-items:center;margin-top:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,var(--accent1),var(--accent2))}

  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60}
  .modal.open{pointer-events:auto}
  .modal-backdrop{position:absolute;inset:0;background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.72));backdrop-filter: blur(8px) saturate(120%)}
  .iframe-modal{position:relative;width:min(1200px,98vw);height:min(86vh,980px);border-radius:12px;overflow:hidden;box-shadow:0 30px 120px rgba(2,6,23,0.9);transform:translateY(12px) scale(.995);transition:transform .28s cubic-bezier(.2,.9,.2,1);border:1px solid rgba(255,255,255,0.04);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));}
  .modal.open .iframe-modal{transform:translateY(0) scale(1)}
  .close-x{position:absolute;right:18px;top:14px;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));border-radius:10px;padding:8px;cursor:pointer;color:white;font-weight:700;border:none;z-index:12;backdrop-filter: blur(4px);box-shadow:0 6px 24px rgba(2,6,23,0.6)}
  .close-x:hover{transform:scale(1.03)}
  .iframe-modal iframe{width:100%;height:100%;display:block;border:0}

  .loader{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:12px;background:var(--glass);display:flex;align-items:center;justify-content:center;z-index:10;box-shadow:0 10px 32px rgba(2,6,23,0.6)}
  .spinner{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,0.08);border-top-color: rgba(255,255,255,0.9); animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .fab{position:fixed;right:28px;bottom:28px;z-index:70;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:14px;padding:12px 14px;color:#021;font-weight:800;box-shadow:0 18px 44px rgba(11,18,44,0.5);cursor:pointer;border:none}

  @media (max-width:760px){ .iframe-wrap{height:900px} .logo{width:48px;height:48px} .iframe-modal{height:92vh} }
  @media (prefers-reduced-motion: reduce){ .blob, .bg-gradient, .iframe-modal, .spinner { animation: none } }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <canvas id="stars"></canvas>
    <div class="bg-gradient"></div>
    <div class="blobs">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>
    <div class="grain"></div>
  </div>

  <div class="wrap" role="main">
    <header class="site-head" aria-label="Form header">
      <div class="brand">
        <div class="logo">F</div>
        <div>
          <h1>Quick Survey</h1>
          <p class="lead">One minute — share your thoughts. Submissions go to the Google Form owner.</p>
        </div>
      </div>

      <div class="actions">
        <div class="subtle">Powered by Google Forms</div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn" id="openModalBtn" aria-haspopup="dialog">Open full screen</button>
          <button class="btn" id="themeBtn" title="Toggle theme">Theme</button>
        </div>
      </div>
    </header>

    <section class="card" aria-labelledby="survey">
      <div id="survey" style="height:0;overflow:hidden">Survey Section</div>

      <div class="iframe-wrap" id="iframeWrap">
        <iframe id="gf" src="https://docs.google.com/forms/d/e/1FAIpQLScqaX-aPUuq9UxdKuuf_wFxFRCMdrpjEPHhsYZLtyvUKGk7iQ/viewform?embedded=true" title="Survey form" loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>

      <div class="meta">
        <div class="dot" aria-hidden></div>
        <div style="font-size:13px">This page is a visual wrapper — submissions still go to the Google Form owner.</div>
      </div>
    </section>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" id="backdrop"></div>

    <div class="iframe-modal" role="document" aria-label="Full screen form container">
      <button class="close-x" id="closeBtn" aria-label="Close (Esc)">✕</button>

      <div class="loader" id="loader" aria-hidden="true" style="display:none">
        <div class="spinner" aria-hidden="true"></div>
      </div>

      <!-- Removed sandbox attribute for maximum compatibility with Google Forms -->
      <iframe id="gfModal" src="" title="Full screen form" loading="lazy" referrerpolicy="no-referrer"></iframe>
    </div>
  </div>

  <button class="fab" id="fab">Open ▶</button>

<script>
// STARFIELD CANVAS (fixed): recalc STAR_COUNT on resize, respect reduced-motion
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
let stars = [];
let rafId = null;

function rand(min,max){ return Math.random()*(max-min)+min }
function createStars(){
  // recalc count based on current size so density is consistent
  const STAR_COUNT = Math.max(20, Math.round((w*h)/45000));
  stars = [];
  for(let i=0;i<STAR_COUNT;i++){
    stars.push({x:Math.random()*w, y:Math.random()*h, r:rand(0.3,1.6), vx:rand(-0.03,0.03), vy:rand(-0.03,0.03), alpha:rand(0.12,0.95) });
  }
}
createStars();

function resize(){
  w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; createStars();
}
window.addEventListener('resize', resize);

function drawStars(){
  ctx.clearRect(0,0,w,h);
  for(let s of stars){
    s.x += s.vx; s.y += s.vy;
    if(s.x<0) s.x=w; if(s.x>w) s.x=0; if(s.y<0) s.y=h; if(s.y>h) s.y=0;
    ctx.beginPath(); ctx.globalAlpha = s.alpha; ctx.fillStyle = '#ffffff'; ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function loop(){ drawStars(); rafId = requestAnimationFrame(loop); }

// Respect reduced-motion: only animate if user allows
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){ loop(); } else { drawStars(); }

// MODAL + FULLSCREEN (fixed)
const openBtn = document.getElementById('openModalBtn');
const modal = document.getElementById('modal');
const closeBtn = document.getElementById('closeBtn');
const gf = document.getElementById('gf');
const gfModal = document.getElementById('gfModal');
const loader = document.getElementById('loader');
const backdrop = document.getElementById('backdrop');
const fab = document.getElementById('fab');

function showLoader(){ loader.style.display = 'flex'; }
function hideLoader(){ loader.style.display = 'none'; }

async function openModal(withFullscreen = true){
  // assign src (do this on open to avoid preloading until necessary)
  gfModal.src = gf.src;
  modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); showLoader();
  await new Promise(r=>setTimeout(r,40));
  if(withFullscreen){
    try{ if (modal.requestFullscreen) await modal.requestFullscreen(); else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); }catch(e){ /* blocked */ }
  }

  // attach a one-time load handler
  const onLoad = () => { gfModal.removeEventListener('load', onLoad); hideLoader(); try{ gfModal.contentWindow && gfModal.contentWindow.focus(); }catch(e){} };
  gfModal.addEventListener('load', onLoad);
}

async function closeModal(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch(e){}
  // delay clearing src so transition can finish
  setTimeout(()=>{ try{ gfModal.src = ''; }catch(e){} hideLoader(); }, 260);
}

openBtn.addEventListener('click', ()=> openModal(true));
closeBtn.addEventListener('click', ()=> closeModal());
backdrop.addEventListener('click', ()=> closeModal());
modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); if(e.key.toLowerCase() === 'f'){ if(modal.classList.contains('open')) closeModal(); else openModal(true); } });
fab.addEventListener('click', ()=> openModal(true));

// Theme toggle (keeps previous)
const themeBtn = document.getElementById('themeBtn');
let alt = false;
themeBtn.addEventListener('click', ()=>{ alt = !alt; if(alt){ document.documentElement.style.setProperty('--accent1','#00ffd5'); document.documentElement.style.setProperty('--accent2','#6a5cff'); } else { document.documentElement.style.setProperty('--accent1','#7b5cff'); document.documentElement.style.setProperty('--accent2','#00c3ff'); } });

// clean up animation frame on page unload
window.addEventListener('beforeunload', ()=>{ if(rafId) cancelAnimationFrame(rafId); });

</script>
</body>
</html>
