<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Survey — Cool Site (Modern)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#07070b;
      --panel:#0f1722;
      --glass: rgba(255,255,255,0.03);
      --muted: rgba(234,240,255,0.7);
      --accent-1: #6ee7b7; /* subtle mint */
      --accent-2: #7c6cff; /* soft violet */
      --card-border: rgba(255,255,255,0.04);
      --glass-strong: rgba(255,255,255,0.06);
    }
    /* Reset & layout */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: radial-gradient(800px 400px at 10% 20%, rgba(124,108,255,0.06), transparent 12%),
                  radial-gradient(600px 300px at 90% 80%, rgba(110,231,183,0.03), transparent 10%),
                  linear-gradient(180deg,var(--bg), #050508 80%);
      color:#e9f1ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-y:auto;
    }

    /* grain / texture overlay */
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:0.06;background-image:radial-gradient(circle at 20% 30%, rgba(255,255,255,0.02) 0, transparent 15%);
      mix-blend-mode:overlay;
    }

    .wrap{width:100%;max-width:1100px}
    header.site-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .brand{display:flex;gap:14px;align-items:center}
    .logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--accent-2),var(--accent-1));display:flex;align-items:center;justify-content:center;font-weight:800;color:#021;font-size:20px;box-shadow:0 8px 30px rgba(0,0,0,0.6);}
    h1{margin:0;font-size:20px;letter-spacing:-0.3px}
    p.lead{margin:0;color:var(--muted);opacity:0.95;font-size:13px}

    .actions{display:flex;gap:10px;align-items:center}
    .btn{ background:linear-gradient(90deg,var(--accent-2),var(--accent-1));border:none;padding:10px 14px;border-radius:12px;color:#021;font-weight:700;cursor:pointer; box-shadow:0 12px 30px rgba(28,18,46,0.6); }
    .subtle{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:8px 10px;border-radius:10px;font-size:13px;border:1px solid rgba(255,255,255,0.02)}

    /* card & iframe */
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:16px; padding:18px; box-shadow:0 12px 60px rgba(2,6,23,0.6); border:1px solid var(--card-border); position:relative; overflow:hidden}

    /* glass header accent */
    .card:before{content:"";position:absolute;left:-30%;top:-40%;width:160%;height:220%;background:conic-gradient(from 150deg at 50% 50%, rgba(124,108,255,0.06), rgba(110,231,183,0.02), transparent 50%);filter:blur(60px);opacity:0.8;pointer-events:none}

    .iframe-wrap{position:relative;width:100%;height:640px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.03);background:linear-gradient(180deg, rgba(0,0,0,0.25), rgba(255,255,255,0.02));backdrop-filter: blur(6px);}

    /* thumbnail overlay + subtle frame to match the provided "cool" site */
    .iframe-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
    .iframe-wrap .frame-glow{position:absolute;inset:10px;border-radius:8px;pointer-events:none;background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);box-shadow:inset 0 0 40px rgba(0,0,0,0.45);}

    .meta{display:flex;gap:12px;align-items:center;margin-top:12px}
    .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,var(--accent-2),var(--accent-1))}

    /* modal */
    .modal{position:fixed;inset:0;background:linear-gradient(180deg, rgba(2,6,23,0.85), rgba(2,6,23,0.92));display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
    .modal.show{display:flex;animation:fadeIn 220ms ease both}
    .iframe-modal{width:100%;max-width:1200px;height:86vh;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.8);background:var(--panel);border:1px solid rgba(255,255,255,0.03);transform-origin:center;}
    .modal .close-x{position:absolute;right:22px;top:18px;background:rgba(255,255,255,0.04);border-radius:10px;padding:8px;cursor:pointer;border:1px solid rgba(255,255,255,0.03);}

    /* little badge */
    .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);font-size:12px;color:var(--muted)}

    /* subtle floating particles using pseudo elements */
    .particles{position:absolute;inset:0;pointer-events:none;}
    .particle{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.03);filter:blur(0.5px);opacity:0.8}
    .p1{left:10%;top:18%;animation:float 9s linear infinite}
    .p2{left:82%;top:24%;width:8px;height:8px;animation:float 14s linear infinite}
    .p3{left:50%;top:70%;width:5px;height:5px;animation:float 11s linear infinite}

    @keyframes float{0%{transform:translateY(0) translateX(0) scale(1)}50%{transform:translateY(-18px) translateX(6px) scale(1.15)}100%{transform:translateY(0) translateX(0) scale(1)}}
    @keyframes fadeIn{0%{opacity:0;transform:scale(.98)}100%{opacity:1;transform:scale(1)}}

    /* responsive tweaks */
    @media (max-width:980px){
      .iframe-wrap{height:720px}
      .iframe-modal{height:92vh}
    }
    @media (max-width:700px){
      header.site-head{flex-direction:column;align-items:flex-start;gap:12px}
      .logo{width:48px;height:48px}
      .iframe-wrap{height:820px}
    }
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <header class="site-head" aria-label="Form header">
      <div class="brand">
        <div class="logo">F</div>
        <div>
          <h1>Quick Survey</h1>
          <p class="lead">One minute — share your thoughts. Responses go to the original Google Form.</p>
        </div>
      </div>

      <div class="actions">
        <div class="subtle badge">Powered by Google Forms</div>
        <button class="btn" id="openModalBtn">Open full screen</button>
      </div>
    </header>

    <section class="card" aria-labelledby="survey">
      <div id="survey" style="height:0;overflow:hidden">Survey Section</div>

      <div class="iframe-wrap" id="iframeWrap" aria-hidden="false">
        <!-- YOUR GOOGLE FORM: already plugged in below -->
        <iframe id="gf" src="https://docs.google.com/forms/d/e/1FAIpQLScqaX-aPUuq9UxdKuuf_wFxFRCMdrpjEPHhsYZLtyvUKGk7iQ/viewform?embedded=true" title="Survey form" loading="lazy" referrerpolicy="no-referrer"></iframe>
        <div class="frame-glow"></div>
        <div class="particles" aria-hidden>
          <div class="particle p1"></div>
          <div class="particle p2"></div>
          <div class="particle p3"></div>
        </div>
      </div>

      <div class="meta">
        <div class="dot" aria-hidden></div>
        <div style="font-size:13px">This page is a visual wrapper — submissions still go to the Google Form owner.</div>
      </div>
    </section>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="close-x" id="closeBtn" aria-label="Close">✕</button>
    <div class="iframe-modal" role="document">
      <iframe id="gfModal" src="" title="Full screen form" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:100%;border:0;display:block"></iframe>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openModalBtn');
    const modal = document.getElementById('modal');
    const closeBtn = document.getElementById('closeBtn');
    const gf = document.getElementById('gf');
    const gfModal = document.getElementById('gfModal');

    function openModal(){
      // copy src only when opening to avoid double requests and keep the small preview fast
      if(!gfModal.src) gfModal.src = gf.src;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      // trap focus to modal
      setTimeout(()=>{ try{ gfModal.contentWindow && gfModal.contentWindow.focus(); }catch(e){} },250);
      document.addEventListener('keydown', onEsc);
    }
    function closeModal(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      // remove src to stop background form activity (helps mobile)
      try{ gfModal.src = ''; }catch(e){}
      document.removeEventListener('keydown', onEsc);
    }
    function onEsc(e){ if(e.key === 'Escape') closeModal(); }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });

    // small progressive enhancement: if user interacts with the iframe preview, open a slightly larger overlay
    // (detect click inside wrapper and open modal) — helps mobile where iframe internal clicks may be tricky
    const iframeWrap = document.getElementById('iframeWrap');
    iframeWrap.addEventListener('click', (e)=>{
      // don't open when clicking the overlay decoration
      if(e.target === iframeWrap || e.target.closest('iframe')) openModal();
    });

    // hint: on some browsers/forms cross-origin policies prevent focusing the inner frame — it's expected
  </script>
</body>
</html>
