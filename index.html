<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Survey — Vanta + Fallback</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050507;
      --panel:#0f1722;
      --muted: rgba(234,240,255,0.72);
      --accent:#7c6cff;
      --card-border: rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;color:#eaf0ff;
      background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;position:relative;overflow:auto;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }

    /* Vanta container behind everything */
    #vanta-bg{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ----------------------------
   CSS fallback (halftone) — runs when Vanta fails
   Uses background-position animation (very reliable)
   ---------------------------- */
    body.vanta-fallback::before,
    body.vanta-fallback::after{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    }

    /* fine halftone dots */
    body.vanta-fallback::before{
      background-image:
        radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 18px 18px, 56px 56px;
      background-position: 0 0, 28px 28px;
      opacity:0.06;
      mix-blend-mode:overlay;
      animation:halftoneShift 20s linear infinite;
      will-change: background-position;
    }

    /* soft drifting light */
    body.vanta-fallback::after{
      background: radial-gradient(700px 240px at 50% 20%, rgba(124,108,255,0.05), transparent 20%),
                  radial-gradient(600px 180px at 50% 80%, rgba(110,231,183,0.02), transparent 20%);
      filter:blur(6px);
      opacity:0.18;
      animation:waveDrift 16s linear infinite;
      mix-blend-mode:screen;
    }

    @keyframes halftoneShift{
      0%{background-position:0 0, 28px 28px}
      50%{background-position:-80px 22px, 8px 56px}
      100%{background-position:0 0, 28px 28px}
    }
    @keyframes waveDrift{
      0%{transform:translateZ(0) translateX(0)}
      50%{transform:translateZ(0) translateX(120px)}
      100%{transform:translateZ(0) translateX(0)}
    }

    /* Respect reduced motion: no animation at all */
    @media (prefers-reduced-motion: reduce){
      body.vanta-fallback::before, body.vanta-fallback::after{animation:none}
    }

    /* Content (above the background) */
    .wrap{position:relative;z-index:2;width:100%;max-width:1100px}
    header.site-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .brand{display:flex;gap:14px;align-items:center}
    .logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#6ee7b7);display:flex;align-items:center;justify-content:center;font-weight:800;color:#021;font-size:20px;box-shadow:0 8px 30px rgba(0,0,0,0.6);}
    h1{margin:0;font-size:20px;letter-spacing:-0.3px}
    p.lead{margin:0;color:var(--muted);opacity:0.95;font-size:13px}

    .actions{display:flex;gap:10px;align-items:center}
    .subtle{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:8px 10px;border-radius:10px;font-size:13px;border:1px solid rgba(255,255,255,0.02)}

    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:16px; padding:18px; box-shadow:0 12px 60px rgba(2,6,23,0.6); border:1px solid var(--card-border); position:relative; overflow:hidden}
    .iframe-wrap{position:relative;width:100%;height:520px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.03);background:linear-gradient(180deg, rgba(0,0,0,0.20), rgba(255,255,255,0.01));backdrop-filter: blur(4px);}
    .iframe-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
    .meta{display:flex;gap:12px;align-items:center;margin-top:12px}
    .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,var(--accent),#6ee7b7)}

    @media (max-width:980px){.iframe-wrap{height:640px}}
    @media (max-width:700px){header.site-head{flex-direction:column;align-items:flex-start;gap:12px}.logo{width:48px;height:48px}.iframe-wrap{height:760px}}
  </style>
</head>
<body>

  <!-- Vanta root (will be filled if Vanta loads) -->
  <div id="vanta-bg" aria-hidden="true"></div>

  <div class="wrap" role="main">
    <header class="site-head" aria-label="Form header">
      <div class="brand">
        <div class="logo">F</div>
        <div>
          <h1>Quick Survey</h1>
          <p class="lead">One minute — share your thoughts. Responses go to the original Google Form.</p>
        </div>
      </div>

      <div class="actions">
        <div class="subtle">Powered by Google Forms</div>
      </div>
    </header>

    <section class="card" aria-labelledby="survey">
      <div id="survey" style="height:0;overflow:hidden">Survey Section</div>

      <div class="iframe-wrap" id="iframeWrap">
        <iframe id="gf" src="https://docs.google.com/forms/d/e/1FAIpQLScqaX-aPUuq9UxdKuuf_wFxFRCMdrpjEPHhsYZLtyvUKGk7iQ/viewform?embedded=true" title="Survey form" loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>

      <div class="meta">
        <div class="dot" aria-hidden></div>
        <div style="font-size:13px">This page is a visual wrapper — submissions still go to the Google Form owner.</div>
      </div>

    </section>
  </div>

  <script>
  /* 
    Load three.js and Vanta dynamically; if either fails we activate CSS fallback.
    If you want to host the JS locally, download the two files and change the paths below.
  */
  (function(){
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){ console.log('Reduced motion preference detected — using CSS fallback'); document.body.classList.add('vanta-fallback'); return; }

    // helper to load script
    function loadScript(src, timeout = 8000){
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        let done = false;
        s.onload = () => { if(done) return; done = true; resolve(); };
        s.onerror = () => { if(done) return; done = true; reject(new Error('Failed to load ' + src)); };
        document.head.appendChild(s);
        // timeout fallback
        setTimeout(()=>{ if(done) return; done = true; reject(new Error('Timeout loading ' + src)); }, timeout);
      });
    }

    // Try to load THREE then Vanta, init; fallback to CSS if anything fails
    (async function initVanta(){
      try{
        // CDN URLs — if your environment blocks CDNs, download these and serve locally
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js');
        await loadScript('https://cdn.jsdelivr.net/gh/tengbao/vanta@0.5.21/dist/vanta.net.min.js');
        if(window.VANTA && window.VANTA.NET){
          window._vantaEffect = VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.0,
            scaleMobile: 1.0,
            color: 0x7c6cff,
            backgroundColor: 0x050507,
            points: 14.00,
            maxDistance: 22.00,
            spacing: 17.00
          });
          console.log('Vanta initialized ✅');
        } else {
          throw new Error('Vanta not available after load');
        }
      } catch(err){
        console.warn('Vanta init failed — falling back to CSS. Error:', err);
        document.body.classList.add('vanta-fallback');
      }
    })();

    // cleanup on navigation (optional)
    window.addEventListener('pagehide', () => {
      if(window._vantaEffect && window._vantaEffect.destroy) window._vantaEffect.destroy();
    });
  })();
  </script>
</body>
</html>
