<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Survey — Cool Site</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#0b1026;--bg2:#07112b;--accent1:#7b5cff;--accent2:#00c3ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;color:#eaf0ff;
       background: radial-gradient(800px 400px at 10% 10%, rgba(123,92,255,0.12), transparent 12%),
                   radial-gradient(600px 300px at 90% 90%, rgba(0,195,255,0.08), transparent 12%),
                   linear-gradient(180deg,var(--bg1),var(--bg2)); display:flex;align-items:center;justify-content:center;padding:28px;}
  .wrap{width:100%;max-width:1000px}
  header.site-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;gap:14px;align-items:center}
  .logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#012}
  h1{margin:0;font-size:20px;letter-spacing:-0.3px}
  p.lead{margin:0;color:rgba(234,240,255,0.8);opacity:0.95}
  .actions{display:flex;gap:10px;align-items:center}
  .btn{
    background:linear-gradient(90deg,var(--accent1),var(--accent2));border:none;padding:10px 14px;border-radius:12px;color:#021;font-weight:700;cursor:pointer;
    box-shadow:0 8px 30px rgba(11,18,44,0.6);
  }
  .subtle{background:rgba(255,255,255,0.03);padding:8px 10px;border-radius:10px;font-size:13px}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:16px; padding:18px; box-shadow:0 12px 40px rgba(2,6,23,0.65); border:1px solid rgba(255,255,255,0.04)}
  .iframe-wrap{position:relative;width:100%;height:720px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.03)}
  .iframe-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .meta{display:flex;gap:12px;align-items:center;margin-top:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,var(--accent1),var(--accent2))}
  .modal{position:fixed;inset:0;background:rgba(2,6,23,0.85);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
  .modal .iframe-modal{width:100%;max-width:1100px;height:90vh;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(2,6,23,0.8)}
  .close-x{position:absolute;right:22px;top:18px;background:rgba(255,255,255,0.05);border-radius:8px;padding:6px;cursor:pointer}
  @media (max-width:760px){
    .iframe-wrap{height:900px}
    .brand h1{font-size:16px}
    .logo{width:48px;height:48px}
  }
</style>
</head>
<body>
  <div class="wrap" role="main">
    <header class="site-head" aria-label="Form header">
      <div class="brand">
        <div class="logo">F</div>
        <div>
          <h1>Quick Survey</h1>
          <p class="lead">One minute — share your thoughts. Responses go to the original Google Form.</p>
        </div>
      </div>

      <div class="actions">
        <div class="subtle">Powered by Google Forms</div>
        <button class="btn" id="openModalBtn">Open full screen</button>
      </div>
    </header>

    <section class="card" aria-labelledby="survey">
      <div id="survey" style="height:0;overflow:hidden">Survey Section</div>

      <div class="iframe-wrap" id="iframeWrap">
        <!-- YOUR GOOGLE FORM: already plugged in below -->
        <iframe id="gf" src="https://docs.google.com/forms/d/e/1FAIpQLScqaX-aPUuq9UxdKuuf_wFxFRCMdrpjEPHhsYZLtyvUKGk7iQ/viewform?embedded=true"
                title="Survey form" loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>

      <div class="meta">
        <div class="dot" aria-hidden></div>
        <div style="font-size:13px">This page is a visual wrapper — submissions still go to the Google Form owner.</div>
      </div>
    </section>
  </div>

  <div class="modal" id="modal">
    <div style="position:relative;width:100%;max-width:1100px">
      <button class="close-x" id="closeBtn" aria-label="Close">✕</button>
      <div class="iframe-modal">
        <iframe id="gfModal" src="" title="Full screen form" loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>
    </div>
  </div>

<script>
  const openBtn = document.getElementById('openModalBtn');
  const modal = document.getElementById('modal');
  const closeBtn = document.getElementById('closeBtn');
  const gf = document.getElementById('gf');
  const gfModal = document.getElementById('gfModal');

  openBtn.addEventListener('click', ()=>{
    gfModal.src = gf.src;
    modal.style.display = 'flex';
    setTimeout(()=>{ try { gfModal.contentWindow && gfModal.contentWindow.focus(); } catch(e){} }, 300);
  });

  closeBtn.addEventListener('click', ()=>{
    modal.style.display = 'none';
    gfModal.src = '';
  });

  modal.addEventListener('click', (e)=>{
    if (e.target === modal) { modal.style.display='none'; gfModal.src=''; }
  });
</script>
</body>
</html>
