<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Statistika regressi</title>

<style>

:root{
  --card-max-width:1100px;
  --card-desktop-height:820px;
  --card-mobile-height:96vh;
}

html,body{
  height:100%;
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
}

/* background gif */

.bg-gif{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
  pointer-events:none;
  filter:brightness(.55) saturate(1.05);
}

/* page */

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
}

/* card */

.card{
  width:min(var(--card-max-width),96%);
  height:min(var(--card-desktop-height),92vh);
  background:rgba(0,0,0,.95);
  color:#fff;
  border-radius:16px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* header */

.card-header{
  padding:1rem 1.25rem;
  border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  flex-direction:column;
}

.title{
  font-size:1.2rem;
  font-weight:700;
}

.subtitle{
  font-size:.9rem;
  opacity:.85;
}

/* response counter */

.resp-badge{
  text-align:right;
}

.resp-text{
  font-weight:700;
  font-size:.95rem;
}

/* progress bar */

.progress-container{
  width:200px;
  height:8px;
  background:rgba(255,255,255,.15);
  border-radius:20px;
  margin-top:4px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#4ade80;
  transition:width .5s ease;
}

/* iframe */

.iframe-wrap{
  flex:1;
  padding:.8rem;
}

iframe{
  width:100%;
  height:100%;
  border:0;
  border-radius:10px;
}

/* footer */

.card-footer{
  padding:.7rem 1rem;
  font-size:.9rem;
  opacity:.85;
  border-top:1px solid rgba(255,255,255,.05);
}

/* mobile */

@media(max-width:900px){

.card{
  width:calc(100% - 1.5rem);
  height:var(--card-mobile-height);
}

.title{font-size:1.05rem}

.progress-container{
  width:150px;
}

}

@media(max-width:520px){

.page{padding:.6rem}

.card{
  width:calc(100% - 1rem);
  height:var(--card-mobile-height);
  border-radius:10px;
}

.card-header{
  padding:.75rem;
}

.iframe-wrap{
  padding:.45rem;
}

.subtitle{
  font-size:.85rem;
}

.progress-container{
  width:120px;
}

}

</style>
</head>

<body>

<img class="bg-gif" src="bg.gif">

<main class="page">

<section class="card">

<div class="card-header">

<div class="brand">
<div class="title">Statistika regresi ⭐</div>
<div class="subtitle">
Hubungan pengaruh jumlah uang saku dengan penghasilan dalam waktu 1 minggu
</div>
</div>

<div class="resp-badge">

<div id="respText" class="resp-text">
Responses: —
</div>

<div class="progress-container">
<div id="progressBar" class="progress-bar"></div>
</div>

</div>

</div>

<div class="iframe-wrap">

<iframe
src="https://docs.google.com/forms/d/e/1FAIpQLScqaX-aPUuq9UxdKuuf_wFxFRCMdrpjEPHhsYZLtyvUKGk7iQ/viewform?embedded=true">
Loading…
</iframe>

</div>

<div class="card-footer">
Note: Data akan tidak dipersebarluaskan
</div>

</section>

</main>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzL4L0koBhUjThDjQefHNyuCaH3OXUsBFUesu_lvpvHk2PgPvBE5L6WzePjD4NfLnEo/exec"

const respText=document.getElementById("respText")
const progressBar=document.getElementById("progressBar")

const POLL_INTERVAL=30000

async function updateBadge(){

try{

const r=await fetch(API_URL,{cache:"no-store"})
const j=await r.json()

const percent=(j.count/j.target)*100

respText.textContent=`Responses: ${j.count} / ${j.target}`

progressBar.style.width=percent+"%"

}

catch(err){

respText.textContent="Responses: error"

}

}

updateBadge()

setInterval(updateBadge,POLL_INTERVAL)

</script>

</body>
</html>
