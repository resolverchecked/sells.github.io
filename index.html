<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Statistika Regresi</title>

<style>
:root{
  --card-max-width:1100px;
  --card-desktop-height:820px;
  --card-mobile-height:96vh;
  --accent:#7c3aed;
  --accent-2:#22c55e;
}

html,body{
  height:100%;
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
}

body{
  background:#050505;
}

.bg-gif{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
  pointer-events:none;
  filter:brightness(.45) saturate(1.05) blur(0px);
  transform:scale(1.03);
}

.overlay{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at top left, rgba(124,58,237,.35), transparent 35%),
    radial-gradient(circle at bottom right, rgba(34,197,94,.22), transparent 30%),
    linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.65));
  pointer-events:none;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
}

.card{
  width:min(var(--card-max-width),96%);
  height:min(var(--card-desktop-height),92vh);
  background:linear-gradient(180deg, rgba(15,15,18,.96), rgba(5,5,8,.96));
  color:#fff;
  border-radius:22px;
  box-shadow:
    0 24px 80px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
}

.card-header{
  padding:1.1rem 1.3rem;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  background:
    linear-gradient(90deg, rgba(255,255,255,.03), transparent 60%);
}

.brand{
  display:flex;
  flex-direction:column;
  gap:.35rem;
}

.title{
  font-size:1.25rem;
  font-weight:800;
  letter-spacing:.2px;
}

.subtitle{
  font-size:.95rem;
  opacity:.82;
  line-height:1.35;
  max-width:700px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  width:fit-content;
  padding:.38rem .75rem;
  border-radius:999px;
  background:linear-gradient(90deg, rgba(124,58,237,.24), rgba(34,197,94,.16));
  border:1px solid rgba(255,255,255,.08);
  font-size:.82rem;
  font-weight:700;
  color:#f4f4f5;
}

.badge-dot{
  width:.55rem;
  height:.55rem;
  border-radius:999px;
  background:linear-gradient(180deg, var(--accent), var(--accent-2));
  box-shadow:0 0 12px rgba(124,58,237,.7);
}

.iframe-wrap{
  flex:1;
  padding:1rem;
}

iframe{
  width:100%;
  height:100%;
  border:0;
  border-radius:16px;
  background:#fff;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}

.card-footer{
  padding:.85rem 1rem;
  font-size:.9rem;
  opacity:.8;
  border-top:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.02);
}

@media(max-width:900px){
  .card{
    width:calc(100% - 1.5rem);
    height:var(--card-mobile-height);
    border-radius:18px;
  }

  .title{font-size:1.08rem}
  .subtitle{font-size:.88rem}
}

@media(max-width:520px){
  .page{padding:.6rem}

  .card{
    width:calc(100% - 1rem);
    border-radius:14px;
  }

  .card-header{
    padding:.8rem;
    flex-direction:column;
    align-items:flex-start;
  }

  .iframe-wrap{
    padding:.5rem;
  }

  .subtitle{
    font-size:.84rem;
  }
}
</style>
</head>

<body>

<img class="bg-gif" src="bg.gif" alt="">
<div class="overlay"></div>

<main class="page">
  <section class="card">
    <div class="card-header">
      <div class="brand">
        <div class="badge"><span class="badge-dot"></span> Survey form</div>
        <div class="title">Statistika Regresi ⭐</div>
        <div class="subtitle">
          Korelasi antara waktu penggunaan gadget dengan waktu tidur malam
        </div>
      </div>
    </div>

    <div class="iframe-wrap">
      <iframe
        src="https://forms.gle/Fz8d5vUNsHnFiyFW6"
        loading="lazy">
        Loading…
      </iframe>
    </div>

    <div class="card-footer">
      Note: Data akan dijaga kerahasiaannya
    </div>
  </section>
</main>

</body>
</html>
